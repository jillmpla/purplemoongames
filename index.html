<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#520293" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://purplemoongames.xyz/" />

    <!-- Favicons -->

      sizes="32x32"

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link

      sizes="76x76"
      href="/apple-touch-icon.png"
    />

    <!-- Web app manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://purplemoongames.xyz/" />

    <meta
      property="og:title"
      content="Purple Moon Games"
    />

    <meta
      property="og:description"
      content="Explore the games, characters, artwork, and play resources from the imaginative world of Purple Moon."
    />

    <meta
      property="og:image"
      content="https://purplemoongames.xyz/social-preview.png"
    />

    <meta
      property="og:image:alt"
      content="Purple Moon Games logo and characters from Whistling Pines"

    <meta
      name="twitter:title"
      content="Purple Moon Games"
    />

    <meta
      name="twitter:description"
      content="Explore the games, characters, artwork, and play resources from the imaginative world of Purple Moon."
    />

    <meta
      name="twitter:image"
      content="https://purplemoongames.xyz/social-preview.png"
    />

    <meta
      name="twitter:image:alt"
      content="Purple Moon Games logo and characters from Whistling Pines"
    />
